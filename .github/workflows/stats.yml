name: Generate Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch stats via GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Buscar stats reais incluindo repos privados e orgs
          STATS=$(gh api graphql -f query='
            query {
              user(login: "jtiberio-sv") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                  totalCommitContributions
                  totalPullRequestContributions
                  totalIssueContributions
                  totalPullRequestReviewContributions
                  restrictedContributionsCount
                }
                repositories(ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER], first: 100) {
                  totalCount
                  nodes {
                    stargazerCount
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      edges {
                        size
                        node { name color }
                      }
                    }
                  }
                }
                followers { totalCount }
                pullRequests { totalCount }
                issues { totalCount }
              }
            }
          ')

          # Extrair valores
          CONTRIBS=$(echo "$STATS" | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          COMMITS=$(echo "$STATS" | jq '.data.user.contributionsCollection.totalCommitContributions')
          PRS=$(echo "$STATS" | jq '.data.user.contributionsCollection.totalPullRequestContributions')
          ISSUES=$(echo "$STATS" | jq '.data.user.contributionsCollection.totalIssueContributions')
          REVIEWS=$(echo "$STATS" | jq '.data.user.contributionsCollection.totalPullRequestReviewContributions')
          PRIVATE=$(echo "$STATS" | jq '.data.user.contributionsCollection.restrictedContributionsCount')
          REPOS=$(echo "$STATS" | jq '.data.user.repositories.totalCount')
          STARS=$(echo "$STATS" | jq '[.data.user.repositories.nodes[].stargazerCount] | add // 0')
          FOLLOWERS=$(echo "$STATS" | jq '.data.user.followers.totalCount')
          TOTAL_PRS=$(echo "$STATS" | jq '.data.user.pullRequests.totalCount')
          TOTAL_ISSUES=$(echo "$STATS" | jq '.data.user.issues.totalCount')

          TOTAL=$((CONTRIBS + PRIVATE))
          YEAR=$(date +%Y)

          # Extrair top linguagens
          LANGS=$(echo "$STATS" | jq -r '
            [.data.user.repositories.nodes[].languages.edges[] | {name: .node.name, color: .node.color, size: .size}]
            | group_by(.name)
            | map({name: .[0].name, color: .[0].color, size: (map(.size) | add)})
            | sort_by(-.size)
            | .[0:8]
            | . as $all
            | ($all | map(.size) | add) as $total
            | map({name, color, pct: ((.size / $total * 100 * 10 | round) / 10)})
            | .[]
            | "\(.name)|\(.color)|\(.pct)"
          ')

          # Gerar SVG
          mkdir -p dist

          # --- Stats Card ---
          cat > dist/stats.svg << SVGEOF
          <svg width="495" height="195" xmlns="http://www.w3.org/2000/svg">
            <rect width="495" height="195" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
            <text x="25" y="35" fill="#58A6FF" font-family="Segoe UI, Ubuntu, sans-serif" font-weight="600" font-size="18">GitHub Stats — $YEAR</text>
            <line x1="25" y1="48" x2="470" y2="48" stroke="#21262d" stroke-width="1"/>

            <text x="25" y="75" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">Total Contributions (${YEAR})</text>
            <text x="300" y="75" fill="#58A6FF" font-family="Segoe UI, Ubuntu, sans-serif" font-weight="700" font-size="14">${TOTAL}</text>

            <text x="25" y="100" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">Commits</text>
            <text x="300" y="100" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${COMMITS}</text>

            <text x="25" y="125" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">Pull Requests</text>
            <text x="300" y="125" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${TOTAL_PRS}</text>

            <text x="25" y="150" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">Issues</text>
            <text x="300" y="150" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${TOTAL_ISSUES}</text>

            <text x="25" y="175" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">Code Reviews</text>
            <text x="300" y="175" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${REVIEWS}</text>

            <text x="350" y="75" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">(+${PRIVATE} private)</text>

            <text x="350" y="125" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">Repos: ${REPOS} | Stars: ${STARS}</text>
            <text x="350" y="150" fill="#8b949e" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">Followers: ${FOLLOWERS}</text>
          </svg>
          SVGEOF

          echo "Stats SVG generated: Total=$TOTAL, Commits=$COMMITS, PRs=$TOTAL_PRS"

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
